[flavor]
name = "picocalc"
description = "SolarOS for the Clockwork PicoCalc with an ESP32-S3-Pico: the full selection without drivers for absent hardware or the messaging services."

# The ESP32-S3-Pico maps only 2 MB of PSRAM. Under `full`, the chat gateway and
# message store reserve about 800 KB of it at boot, which leaves no block large
# enough for the 512 KB Python heap. This profile therefore omits chat, the chat
# gateway and server, IRC, SC2 and MeshCore, plus drivers for hardware the
# PicoCalc does not have: other displays, touch, cameras, radios, GNSS, modems,
# sensors, RTC and fuel-gauge chips, other keyboards and input devices, I2S
# audio, SPI SD cards and header actuators (servo, motor, encoder, 1-Wire,
# GPIO keys).

